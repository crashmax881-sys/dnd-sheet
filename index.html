<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@owlbear-rodeo/sdk"></script>
</head>
<body>
    <div id="app">
        <div class="header">
            <input type="text" id="charName" placeholder="Имя персонажа..." oninput="autoSave()">
        </div>

        <div id="stats-list">
            <!-- Секции будут генерироваться JS для чистоты кода -->
        </div>

        <div class="footer">
            <p id="status">Загрузка...</p>
        </div>
    </div>

    <script>
        const OBR = window.OBR;
        
        // Структура данных характеристик и навыков
        const SCHEMA = [
            { id: 'str', name: 'СИЛА', skills: ['Атлетика'] },
            { id: 'dex', name: 'ЛОВКОСТЬ', skills: ['Акробатика', 'Ловкость рук', 'Скрытность'] },
            { id: 'con', name: 'ТЕЛОСЛОЖЕНИЕ', skills: [] },
            { id: 'int', name: 'ИНТЕЛЛЕКТ', skills: ['Анализ', 'История', 'Магия', 'Природа', 'Религия'] },
            { id: 'wis', name: 'МУДРОСТЬ', skills: ['Внимательность', 'Выживание', 'Медицина', 'Проницательность', 'Уход за животными'] },
            { id: 'cha', name: 'ХАРИЗМА', skills: ['Выступление', 'Запугивание', 'Обман', 'Убеждение'] }
        ];

        // Инициализация интерфейса
        function buildUI() {
            const container = document.getElementById('stats-list');
            SCHEMA.forEach(stat => {
                let html = `
                    <div class="stat-group">
                        <div class="stat-header">
                            <span>${stat.name}</span>
                            <input type="number" id="${stat.id}" value="10" oninput="updateAll()">
                        </div>
                        <div class="stat-actions">
                            <div class="action-item" onclick="sendDiceRoll('${stat.name}', '${stat.id}')">
                                <span>ПРОВЕРКА</span> <div class="mod-val" id="${stat.id}_mod">+0</div>
                            </div>
                            <div class="action-item">
                                <span>СПАСБРОСОК</span> <div class="mod-val" id="${stat.id}_save">+0</div>
                            </div>
                        </div>
                        <div class="skills-list">
                            ${stat.skills.map(skill => `
                                <div class="skill-item" onclick="sendDiceRoll('${skill}', '${stat.id}')">
                                    <span>${skill.toUpperCase()}</span>
                                    <div class="mod-val" id="${stat.id}_${skill}">+0</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        function updateAll() {
            SCHEMA.forEach(stat => {
                const val = document.getElementById(stat.id).value;
                const mod = Math.floor((val - 10) / 2);
                const modStr = (mod >= 0 ? '+' : '') + mod;
                
                document.getElementById(`${stat.id}_mod`).innerText = modStr;
                document.getElementById(`${stat.id}_save`).innerText = modStr;
                stat.skills.forEach(skill => {
                    document.getElementById(`${stat.id}_${skill}`).innerText = modStr;
                });
            });
            autoSave();
        }

        // Интеграция с расширением Dice
        async function sendDiceRoll(label, statId) {
            const val = document.getElementById(statId).value;
            const mod = Math.floor((val - 10) / 2);
            
            // Формат сообщения для расширения Dice (v2)
            // Мы транслируем сообщение в шину данных Owlbear
            OBR.broadcast.sendMessage("re.owlbear.dice/roll", {
                dice: [{ type: "d20", modifier: mod }],
                label: label
            });
        }

        async function autoSave() {
            const data = { name: document.getElementById('charName').value };
            SCHEMA.forEach(s => data[s.id] = document.getElementById(s.id).value);
            await OBR.player.setMetadata({ "ru_dnd_sheet/v2": data });
        }

        OBR.onReady(async () => {
            buildUI();
            const metadata = await OBR.player.getMetadata();
            const data = metadata["ru_dnd_sheet/v2"];
            if (data) {
                document.getElementById('charName').value = data.name || "";
                SCHEMA.forEach(s => {
                    if (data[s.id]) document.getElementById(s.id).value = data[s.id];
                });
            }
            updateAll();
            document.getElementById('status').innerText = "Готов";
        });
    </script>
</body>
</html>
