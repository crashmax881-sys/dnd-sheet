<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="header">
            <input type="text" id="charName" placeholder="Имя персонажа...">
        </div>

        <div id="stats-list">
            <!-- Секции генерируются через JS -->
        </div>

        <div class="footer">
            <p id="status">Загрузка...</p>
        </div>
    </div>

    <script type="module">
        // Используем Skypack CDN - он стабильнее работает с CORS и модулями
        import OBR from "https://cdn.skypack.dev/@owlbear-rodeo/sdk";

        const SCHEMA = [
            { id: 'str', name: 'СИЛА', skills: ['Атлетика'] },
            { id: 'dex', name: 'ЛОВКОСТЬ', skills: ['Акробатика', 'Ловкость рук', 'Скрытность'] },
            { id: 'con', name: 'ТЕЛОСЛОЖЕНИЕ', skills: [] },
            { id: 'int', name: 'ИНТЕЛЛЕКТ', skills: ['Анализ', 'История', 'Магия', 'Природа', 'Религия'] },
            { id: 'wis', name: 'МУДРОСТЬ', skills: ['Внимательность', 'Выживание', 'Медицина', 'Проницательность', 'Уход за животными'] },
            { id: 'cha', name: 'ХАРИЗМА', skills: ['Выступление', 'Запугивание', 'Обман', 'Убеждение'] }
        ];

        function buildUI() {
            const container = document.getElementById('stats-list');
            if (!container) return;
            container.innerHTML = ''; 
            
            SCHEMA.forEach(stat => {
                const html = `
                    <div class="stat-group">
                        <div class="stat-header">
                            <span>${stat.name}</span>
                            <input type="number" id="${stat.id}" value="10">
                        </div>
                        <div class="stat-actions">
                            <div class="action-item" id="btn_${stat.id}_mod">
                                <span>ПРОВЕРКА</span> <div class="mod-val" id="${stat.id}_mod">+0</div>
                            </div>
                            <div class="action-item">
                                <span>СПАСБРОСОК</span> <div class="mod-val" id="${stat.id}_save">+0</div>
                            </div>
                        </div>
                        <div class="skills-list">
                            ${stat.skills.map(skill => `
                                <div class="skill-item" id="btn_${stat.id}_${skill}">
                                    <span>${skill.toUpperCase()}</span>
                                    <div class="mod-val" id="${stat.id}_${skill}">+0</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });

            // Назначаем обработчики событий программно
            SCHEMA.forEach(stat => {
                document.getElementById(stat.id).addEventListener('input', updateAll);
                document.getElementById(`btn_${stat.id}_mod`).onclick = () => sendDiceRoll(stat.name, stat.id);
                stat.skills.forEach(skill => {
                    const skillBtn = document.getElementById(`btn_${stat.id}_${skill}`);
                    if (skillBtn) {
                        skillBtn.onclick = () => sendDiceRoll(skill, stat.id);
                    }
                });
            });
        }

        function updateAll() {
            SCHEMA.forEach(stat => {
                const input = document.getElementById(stat.id);
                if (!input) return;
                
                const val = input.value;
                const mod = Math.floor((val - 10) / 2);
                const modStr = (mod >= 0 ? '+' : '') + mod;
                
                const modEl = document.getElementById(`${stat.id}_mod`);
                const saveEl = document.getElementById(`${stat.id}_save`);
                if (modEl) modEl.innerText = modStr;
                if (saveEl) saveEl.innerText = modStr;

                stat.skills.forEach(skill => {
                    const skillEl = document.getElementById(`${stat.id}_${skill}`);
                    if (skillEl) skillEl.innerText = modStr;
                });
            });
            autoSave();
        }

        async function sendDiceRoll(label, statId) {
            const input = document.getElementById(statId);
            const val = input ? input.value : 10;
            const mod = Math.floor((val - 10) / 2);
            
            try {
                await OBR.broadcast.sendMessage("re.owlbear.dice/roll", {
                    dice: [{ type: "d20", modifier: mod }],
                    label: label
                });
            } catch (e) {
                console.error("Dice error:", e);
            }
        }

        async function autoSave() {
            try {
                const data = { name: document.getElementById('charName').value };
                SCHEMA.forEach(s => {
                    const el = document.getElementById(s.id);
                    if (el) data[s.id] = el.value;
                });
                await OBR.player.setMetadata({ "ru_dnd_sheet/v2": data });
            } catch (e) { 
                console.error("Save error:", e); 
            }
        }

        OBR.onReady(async () => {
            try {
                buildUI();
                const metadata = await OBR.player.getMetadata();
                const data = metadata["ru_dnd_sheet/v2"];
                
                if (data) {
                    if (data.name) document.getElementById('charName').value = data.name;
                    SCHEMA.forEach(s => {
                        const el = document.getElementById(s.id);
                        if (el && data[s.id]) el.value = data[s.id];
                    });
                }
                updateAll();
                
                document.getElementById('charName').addEventListener('input', autoSave);
                document.getElementById('status').innerText = "Готов";
            } catch (err) {
                console.error("Initialization error:", err);
                document.getElementById('status').innerText = "Ошибка запуска";
            }
        });
    </script>
</body>
</html>
