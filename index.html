<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="header">
            <input type="text" id="charName" placeholder="Имя персонажа...">
        </div>
        <div id="stats-list"></div>
        <div class="footer">
            <p id="status">Загрузка...</p>
        </div>
    </div>

    <script type="module">
        import OBR from "https://cdn.skypack.dev/@owlbear-rodeo/sdk";

        // --- НАСТРОЙКИ DDDICE ---
        const DDDICE_API_KEY = "YGz09N0ieJkYsDTYlEOORaEjwHfmUCsZyzbJVq5Tccc4b24e"; 
        const DDDICE_ROOM_SLUG = "RHvhOWD";
        // -------------------------

        const SCHEMA = [
            { id: 'str', name: 'СИЛА', skills: ['Атлетика'] },
            { id: 'dex', name: 'ЛОВКОСТЬ', skills: ['Акробатика', 'Ловкость рук', 'Скрытность'] },
            { id: 'con', name: 'ТЕЛОСЛОЖЕНИЕ', skills: [] },
            { id: 'int', name: 'ИНТЕЛЛЕКТ', skills: ['Анализ', 'История', 'Магия', 'Природа', 'Религия'] },
            { id: 'wis', name: 'МУДРОСТЬ', skills: ['Внимательность', 'Выживание', 'Медицина', 'Проницательность', 'Уход за животными'] },
            { id: 'cha', name: 'ХАРИЗМА', skills: ['Выступление', 'Запугивание', 'Обман', 'Убеждение'] }
        ];

        function buildUI() {
            const container = document.getElementById('stats-list');
            if (!container) return;
            container.innerHTML = ''; 
            
            SCHEMA.forEach(stat => {
                const html = `
                    <div class="stat-group">
                        <div class="stat-header">
                            <span>${stat.name}</span>
                            <input type="number" id="${stat.id}" value="10">
                        </div>
                        <div class="stat-actions">
                            <div class="action-item roll-trigger" data-label="${stat.name} (Проверка)" data-stat="${stat.id}">
                                <span>ПРОВЕРКА</span> <div class="mod-val" id="${stat.id}_mod">+0</div>
                            </div>
                            <div class="action-item roll-trigger" data-label="${stat.name} (Спасбросок)" data-stat="${stat.id}">
                                <span>СПАСБРОСОК</span> <div class="mod-val" id="${stat.id}_save">+0</div>
                            </div>
                        </div>
                        <div class="skills-list">
                            ${stat.skills.map(skill => `
                                <div class="skill-item roll-trigger" data-label="${skill}" data-stat="${stat.id}">
                                    <span>${skill.toUpperCase()}</span>
                                    <div class="mod-val" id="${stat.id}_${skill}">+0</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });

            document.querySelectorAll('.roll-trigger').forEach(el => {
                el.onclick = () => sendDiceRoll(el.getAttribute('data-label'), el.getAttribute('data-stat'));
            });

            SCHEMA.forEach(stat => {
                const el = document.getElementById(stat.id);
                if (el) el.oninput = updateAll;
            });
        }

        function updateAll() {
            SCHEMA.forEach(stat => {
                const input = document.getElementById(stat.id);
                if (!input) return;
                const mod = Math.floor((input.value - 10) / 2);
                const modStr = (mod >= 0 ? '+' : '') + mod;
                if (document.getElementById(`${stat.id}_mod`)) document.getElementById(`${stat.id}_mod`).innerText = modStr;
                if (document.getElementById(`${stat.id}_save`)) document.getElementById(`${stat.id}_save`).innerText = modStr;
                stat.skills.forEach(skill => {
                    const skEl = document.getElementById(`${stat.id}_${skill}`);
                    if (skEl) skEl.innerText = modStr;
                });
            });
            autoSave();
        }

        async function sendDiceRoll(label, statId) {
            const input = document.getElementById(statId);
            const mod = Math.floor(((input ? input.value : 10) - 10) / 2);
            const charName = document.getElementById('charName').value || "Герой";

            document.getElementById('status').innerText = "Бросаю кубик...";

            // Собираем правильный формат кубика для dddice API
            // Если модификатор равен 0, кидаем чистый d20. Если нет - добавляем модификатор.
            const diceArray = [{ type: "d20" }];
            if (mod !== 0) {
                diceArray.push({ type: "mod", value: mod });
            }

            try {
                const response = await fetch("https://dddice.com/api/1.0/roll", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${DDDICE_API_KEY}`,
                        "Content-Type": "application/json",
                        "Accept": "application/json",
                    },
                    body: JSON.stringify({
                        dice: diceArray,
                        room: DDDICE_ROOM_SLUG,
                        label: `${charName}: ${label}`
                    })
                });

                if (response.ok) {
                    document.getElementById('status').innerText = "Кубик брошен!";
                } else {
                    const errData = await response.json();
                    console.error("Ошибка API dddice:", errData);
                    document.getElementById('status').innerText = "Ошибка броска";
                }
            } catch (e) {
                console.error("Сетевая ошибка при броске:", e);
                document.getElementById('status').innerText = "Ошибка сети";
            }
            setTimeout(() => document.getElementById('status').innerText = "Готов", 1500);
        }

        async function autoSave() {
            try {
                const data = { name: document.getElementById('charName').value };
                SCHEMA.forEach(s => data[s.id] = document.getElementById(s.id).value);
                await OBR.player.setMetadata({ "ru_dnd_sheet/v2": data });
            } catch (e) { }
        }

        OBR.onReady(async () => {
            buildUI();
            const metadata = await OBR.player.getMetadata();
            const data = metadata["ru_dnd_sheet/v2"];
            if (data) {
                document.getElementById('charName').value = data.name || "";
                SCHEMA.forEach(s => { if (data[s.id]) document.getElementById(s.id).value = data[s.id]; });
            }
            updateAll();
            document.getElementById('charName').oninput = autoSave;
            document.getElementById('status').innerText = "Готов";
        });
    </script>
</body>
</html>
