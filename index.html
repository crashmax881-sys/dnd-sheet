<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <style>
        #debug-log {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 8px;
            max-height: 120px;
            overflow-y: auto;
            border-top: 2px solid #444;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <input type="text" id="charName" placeholder="Имя персонажа...">
        </div>
        <div id="stats-list"></div>
        <div class="footer">
            <p id="status">v1.33.0 - Ready</p>
            <div id="debug-log"></div>
        </div>
    </div>

    <script type="module">
        import OBR from "https://cdn.skypack.dev/@owlbear-rodeo/sdk";

        const SCHEMA = [
            { id: 'str', name: 'СИЛА', skills: ['Атлетика'] },
            { id: 'dex', name: 'ЛОВКОСТЬ', skills: ['Акробатика', 'Ловкость рук', 'Скрытность'] },
            { id: 'con', name: 'ТЕЛОСЛОЖЕНИЕ', skills: [] },
            { id: 'int', name: 'ИНТЕЛЛЕКТ', skills: ['Анализ', 'История', 'Магия', 'Природа', 'Религия'] },
            { id: 'wis', name: 'МУДРОСТЬ', skills: ['Внимательность', 'Выживание', 'Медицина', 'Проницательность', 'Уход за животными'] },
            { id: 'cha', name: 'ХАРИЗМА', skills: ['Выступление', 'Запугивание', 'Обман', 'Убеждение'] }
        ];

        function log(msg) {
            const el = document.getElementById('debug-log');
            if (el) {
                el.innerText += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
                el.scrollTop = el.scrollHeight;
            }
        }

        async function rollOnMap(label, statId) {
            log(`Starting roll for ${label}...`);
            const input = document.getElementById(statId);
            const mod = Math.floor(((input ? input.value : 10) - 10) / 2);
            const charName = document.getElementById('charName').value || "Герой";
            
            const d20 = Math.floor(Math.random() * 20) + 1;
            const total = d20 + mod;

            try {
                // 1. Проверка метода
                if (!OBR.scene.items || !OBR.scene.items.addItems) {
                    throw new Error("OBR.scene.items.addItems is not available");
                }

                // 2. Создаем минимально возможный объект по документации
                const diceItem = {
                    id: `d_${Date.now()}`,
                    type: "LABEL",
                    name: "Dice",
                    position: { x: 0, y: 0 },
                    visible: true,
                    layer: "CHARACTER",
                    text: {
                        plainText: `${charName}: ${total} (${label})`,
                        style: {
                            fillColor: "#ffffff",
                            fontSize: 40,
                            fontWeight: 700,
                            textAlign: "CENTER",
                            verticalAlign: "MIDDLE",
                            backgroundColor: d20 === 20 ? "#ff0" : "#44f",
                            backgroundOpacity: 1,
                            padding: 10
                        },
                        width: 400,
                        height: 100
                    }
                };

                log("Attempting to addItems...");
                await OBR.scene.items.addItems([diceItem]);
                log("SUCCESS: Item added to scene.");

                // Удаление
                setTimeout(() => {
                    OBR.scene.items.deleteItems([diceItem.id]).catch(e => log("Delete fail: " + e.message));
                }, 5000);

            } catch (e) {
                log("ROLL ERROR: " + e.message);
                console.error(e);
            }
        }

        function buildUI() {
            const container = document.getElementById('stats-list');
            if (!container) return;
            container.innerHTML = ''; 
            SCHEMA.forEach(stat => {
                container.insertAdjacentHTML('beforeend', `
                    <div class="stat-group">
                        <div class="stat-header"><span>${stat.name}</span><input type="number" id="${stat.id}" value="10"></div>
                        <div class="stat-actions">
                            <div class="action-item roll-trigger" data-label="${stat.name}" data-stat="${stat.id}">
                                <span>ПРОВЕРКА</span> <div class="mod-val" id="${stat.id}_mod">+0</div>
                            </div>
                            <div class="action-item roll-trigger" data-label="${stat.name} (Спас)" data-stat="${stat.id}">
                                <span>СПАС</span> <div class="mod-val" id="${stat.id}_save">+0</div>
                            </div>
                        </div>
                        <div class="skills-list">
                            ${stat.skills.map(skill => `<div class="skill-item roll-trigger" data-label="${skill}" data-stat="${stat.id}"><span>${skill.toUpperCase()}</span><div class="mod-val" id="${stat.id}_${skill}">+0</div></div>`).join('')}
                        </div>
                    </div>
                `);
            });
            document.querySelectorAll('.roll-trigger').forEach(el => {
                el.onclick = () => rollOnMap(el.getAttribute('data-label'), el.getAttribute('data-stat'));
            });
            SCHEMA.forEach(stat => {
                const el = document.getElementById(stat.id);
                if (el) el.oninput = updateAll;
            });
        }

        function updateAll() {
            SCHEMA.forEach(stat => {
                const input = document.getElementById(stat.id);
                if (!input) return;
                const mod = Math.floor((input.value - 10) / 2);
                const modStr = (mod >= 0 ? '+' : '') + mod;
                document.getElementById(`${stat.id}_mod`).innerText = modStr;
                document.getElementById(`${stat.id}_save`).innerText = modStr;
                stat.skills.forEach(skill => {
                    const el = document.getElementById(`${stat.id}_${skill}`);
                    if (el) el.innerText = modStr;
                });
            });
            autoSave();
        }

        async function autoSave() {
            const data = { name: document.getElementById('charName').value };
            SCHEMA.forEach(s => data[s.id] = document.getElementById(s.id).value);
            await OBR.player.setMetadata({ "ru_dnd_sheet/v2": data });
        }

        OBR.onReady(async () => {
            buildUI();
            log("SDK Ready. Checking Scene...");
            const ready = await OBR.scene.isReady();
            log("Scene Ready: " + ready);
            
            const metadata = await OBR.player.getMetadata();
            const data = metadata["ru_dnd_sheet/v2"];
            if (data) {
                document.getElementById('charName').value = data.name || "";
                SCHEMA.forEach(s => { 
                    const input = document.getElementById(s.id);
                    if (input && data[s.id]) input.value = data[s.id]; 
                });
            }
            updateAll();
            document.getElementById('charName').oninput = autoSave;
        });
    </script>
</body>
</html>
