<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Стиль для локального предпросмотра (опционально) */
        .local-status { font-style: italic; color: #888; font-size: 12px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <input type="text" id="charName" placeholder="Имя персонажа...">
        </div>
        <div id="stats-list"></div>
        <div class="footer">
            <p id="status">Готов к броскам на поле (v1.27.0)</p>
        </div>
    </div>

    <script type="module">
        import OBR from "https://cdn.skypack.dev/@owlbear-rodeo/sdk";

        const SCHEMA = [
            { id: 'str', name: 'СИЛА', skills: ['Атлетика'] },
            { id: 'dex', name: 'ЛОВКОСТЬ', skills: ['Акробатика', 'Ловкость рук', 'Скрытность'] },
            { id: 'con', name: 'ТЕЛОСЛОЖЕНИЕ', skills: [] },
            { id: 'int', name: 'ИНТЕЛЛЕКТ', skills: ['Анализ', 'История', 'Magic', 'Природа', 'Религия'] },
            { id: 'wis', name: 'МУДРОСТЬ', skills: ['Внимательность', 'Выживание', 'Медицина', 'Проницательность', 'Уход за животными'] },
            { id: 'cha', name: 'ХАРИЗМА', skills: ['Выступление', 'Запугивание', 'Обман', 'Убеждение'] }
        ];

        // Функция генерации броска на поле
        async function rollOnMap(label, statId) {
            const mod = Math.floor((document.getElementById(statId).value - 10) / 2);
            const charName = document.getElementById('charName').value || "Герой";
            
            const d20 = Math.floor(Math.random() * 20) + 1;
            const total = d20 + mod;

            // 1. Отправляем в чат для истории
            OBR.chat.sendMessage(`${charName}: ${label} ➔ **${total}** (d20[${d20}] ${mod >= 0 ? '+' : ''}${mod})`);

            // 2. Создаем "объемный" кубик на карте
            // Получаем центр текущего вида игрока, чтобы спавнить кубик перед глазами
            const viewport = await OBR.viewport.getRect();
            const center = {
                x: viewport.x + viewport.width / 2,
                y: viewport.y + viewport.height / 2
            };

            const diceId = `dice_${Date.now()}`;
            
            // Текстовый элемент с эффектом объема (используем Label)
            const diceItem = {
                id: diceId,
                type: "LABEL",
                name: "Dice Roll",
                position: center,
                attachedTo: "",
                locked: false,
                visible: true,
                rotation: (Math.random() * 20) - 10, // Легкий случайный наклон
                text: {
                    plainText: `${total}`,
                    style: {
                        fillColor: "#ffffff",
                        fillOpacity: 1,
                        fontSize: 60,
                        fontFamily: "Roboto, sans-serif",
                        fontWeight: 800,
                        textAlign: "CENTER",
                        verticalAlign: "MIDDLE",
                        lineHeight: 1.2,
                        padding: 20,
                        outlineColor: "#000000",
                        outlineWidth: 4,
                        // Имитация объема через подложку (background)
                        backgroundColor: d20 === 20 ? "#ff0000" : "#4444ff",
                        backgroundOpacity: 1,
                        borderRadius: 15,
                        borderWidth: 5,
                        borderColor: "#ffffff"
                    },
                    richText: [],
                    width: 120,
                    height: 120
                },
                metadata: { "isDice": true }
            };

            // Добавляем описание (кто и что кинул) вторым элементом чуть выше
            const labelItem = {
                id: diceId + "_label",
                type: "LABEL",
                position: { x: center.x, y: center.y - 100 },
                text: {
                    plainText: `${charName}\n${label}`,
                    style: {
                        fillColor: "#ffffff",
                        fontSize: 24,
                        textAlign: "CENTER",
                        backgroundColor: "#222222",
                        backgroundOpacity: 0.8,
                        padding: 10,
                        borderRadius: 5
                    },
                    width: 300,
                    height: 80
                }
            };

            await OBR.scene.local.addItems([diceItem, labelItem]);

            // Автоматическое удаление через 5 секунд
            setTimeout(async () => {
                await OBR.scene.local.removeItems([diceId, diceId + "_label"]);
            }, 5000);
        }

        // --- Стандартные функции UI ---
        function buildUI() {
            const container = document.getElementById('stats-list');
            if (!container) return;
            container.innerHTML = ''; 
            SCHEMA.forEach(stat => {
                container.insertAdjacentHTML('beforeend', `
                    <div class="stat-group">
                        <div class="stat-header"><span>${stat.name}</span><input type="number" id="${stat.id}" value="10"></div>
                        <div class="stat-actions">
                            <div class="action-item roll-trigger" data-label="${stat.name} (Проверка)" data-stat="${stat.id}">
                                <span>ПРОВЕРКА</span> <div class="mod-val" id="${stat.id}_mod">+0</div>
                            </div>
                            <div class="action-item roll-trigger" data-label="${stat.name} (Спас)" data-stat="${stat.id}">
                                <span>СПАС</span> <div class="mod-val" id="${stat.id}_save">+0</div>
                            </div>
                        </div>
                        <div class="skills-list">
                            ${stat.skills.map(skill => `<div class="skill-item roll-trigger" data-label="${skill}" data-stat="${stat.id}"><span>${skill.toUpperCase()}</span><div class="mod-val" id="${stat.id}_${skill}">+0</div></div>`).join('')}
                        </div>
                    </div>
                `);
            });
            document.querySelectorAll('.roll-trigger').forEach(el => {
                el.onclick = () => rollOnMap(el.getAttribute('data-label'), el.getAttribute('data-stat'));
            });
            SCHEMA.forEach(stat => document.getElementById(stat.id).oninput = updateAll);
        }

        function updateAll() {
            SCHEMA.forEach(stat => {
                const input = document.getElementById(stat.id);
                const mod = Math.floor((input.value - 10) / 2);
                const modStr = (mod >= 0 ? '+' : '') + mod;
                if (document.getElementById(`${stat.id}_mod`)) document.getElementById(`${stat.id}_mod`).innerText = modStr;
                if (document.getElementById(`${stat.id}_save`)) document.getElementById(`${stat.id}_save`).innerText = modStr;
                stat.skills.forEach(skill => {
                    const el = document.getElementById(`${stat.id}_${skill}`);
                    if (el) el.innerText = modStr;
                });
            });
            autoSave();
        }

        async function autoSave() {
            const data = { name: document.getElementById('charName').value };
            SCHEMA.forEach(s => data[s.id] = document.getElementById(s.id).value);
            await OBR.player.setMetadata({ "ru_dnd_sheet/v2": data });
        }

        OBR.onReady(async () => {
            buildUI();
            const metadata = await OBR.player.getMetadata();
            const data = metadata["ru_dnd_sheet/v2"];
            if (data) {
                document.getElementById('charName').value = data.name || "";
                SCHEMA.forEach(s => { if (data[s.id]) document.getElementById(s.id).value = data[s.id]; });
            }
            updateAll();
            document.getElementById('charName').oninput = autoSave;
        });
    </script>
</body>
</html>
