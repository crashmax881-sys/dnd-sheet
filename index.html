<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="header">
            <input type="text" id="charName" placeholder="Имя персонажа...">
        </div>
        <div id="stats-list"></div>
        <div class="footer">
            <p id="status">Синхронизация тем (v1.24.0)</p>
        </div>
    </div>

    <script type="module">
        import OBR from "https://cdn.skypack.dev/@owlbear-rodeo/sdk";

        const API_KEY = "YGz09N0ieJkYsDTYlEOORaEjwHfmUCsZyzbJVq5Tccc4b24e"; 
        const ROOM_SLUG = "VaKE-Br";
        let SELECTED_THEME_ID = "dddice-standard-black"; // Резервный ID

        const SCHEMA = [
            { id: 'str', name: 'СИЛА', skills: ['Атлетика'] },
            { id: 'dex', name: 'ЛОВКОСТЬ', skills: ['Акробатика', 'Ловкость рук', 'Скрытность'] },
            { id: 'con', name: 'ТЕЛОСЛОЖЕНИЕ', skills: [] },
            { id: 'int', name: 'ИНТЕЛЛЕКТ', skills: ['Анализ', 'История', 'Магия', 'Природа', 'Религия'] },
            { id: 'wis', name: 'МУДРОСТЬ', skills: ['Внимательность', 'Выживание', 'Медицина', 'Проницательность', 'Уход за животными'] },
            { id: 'cha', name: 'ХАРИЗМА', skills: ['Выступление', 'Запугивание', 'Обман', 'Убеждение'] }
        ];

        // Функция получения списка доступных тем (согласно вашей ссылке)
        async function fetchAvailableThemes() {
            try {
                const response = await fetch("https://dddice.com/api/1.0/theme", {
                    headers: { 
                        "Authorization": "Bearer " + API_KEY, 
                        "Accept": "application/json" 
                    }
                });
                const json = await response.json();
                
                // Если темы найдены, берем ID первой доступной
                if (json.data && json.data.length > 0) {
                    SELECTED_THEME_ID = json.data[0].id;
                    console.log("Выбрана тема из вашего списка:", SELECTED_THEME_ID);
                }
            } catch (e) {
                console.error("Ошибка при получении тем:", e);
            }
        }

        function buildUI() {
            const container = document.getElementById('stats-list');
            if (!container) return;
            container.innerHTML = ''; 
            SCHEMA.forEach(stat => {
                container.insertAdjacentHTML('beforeend', `
                    <div class="stat-group">
                        <div class="stat-header"><span>${stat.name}</span><input type="number" id="${stat.id}" value="10"></div>
                        <div class="stat-actions">
                            <div class="action-item roll-trigger" data-label="${stat.name}" data-stat="${stat.id}">
                                <span>ПРОВЕРКА</span> <div class="mod-val" id="${stat.id}_mod">+0</div>
                            </div>
                            <div class="action-item roll-trigger" data-label="${stat.name} (Спас)" data-stat="${stat.id}">
                                <span>СПАСБРОСОК</span> <div class="mod-val" id="${stat.id}_save">+0</div>
                            </div>
                        </div>
                        <div class="skills-list">
                            ${stat.skills.map(skill => `<div class="skill-item roll-trigger" data-label="${skill}" data-stat="${stat.id}"><span>${skill.toUpperCase()}</span><div class="mod-val" id="${stat.id}_${skill}">+0</div></div>`).join('')}
                        </div>
                    </div>
                `);
            });
            document.querySelectorAll('.roll-trigger').forEach(el => {
                el.onclick = () => sendDiceRoll(el.getAttribute('data-label'), el.getAttribute('data-stat'));
            });
            SCHEMA.forEach(stat => {
                const input = document.getElementById(stat.id);
                if (input) input.oninput = updateAll;
            });
        }

        function updateAll() {
            SCHEMA.forEach(stat => {
                const input = document.getElementById(stat.id);
                if (!input) return;
                const mod = Math.floor((input.value - 10) / 2);
                const modStr = (mod >= 0 ? '+' : '') + mod;
                if (document.getElementById(`${stat.id}_mod`)) document.getElementById(`${stat.id}_mod`).innerText = modStr;
                if (document.getElementById(`${stat.id}_save`)) document.getElementById(`${stat.id}_save`).innerText = modStr;
                stat.skills.forEach(skill => {
                    const el = document.getElementById(`${stat.id}_${skill}`);
                    if (el) el.innerText = modStr;
                });
            });
            autoSave();
        }

        async function sendDiceRoll(label, statId) {
            const mod = Math.floor((document.getElementById(statId).value - 10) / 2);
            const charName = document.getElementById('charName').value || "Герой";
            const status = document.getElementById('status');

            status.innerText = "🎲 Бросаю...";

            try {
                const response = await fetch("https://dddice.com/api/1.0/roll", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + API_KEY,
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        dice: [{ 
                            type: "d20", 
                            theme: SELECTED_THEME_ID 
                        }],
                        room: ROOM_SLUG,
                        operator: { value: mod, type: "add" },
                        label: `${charName}: ${label}`
                    })
                });

                if (response.ok) {
                    status.innerText = "Успех!";
                    status.style.color = "#00ffcc";
                } else {
                    const err = await response.json();
                    console.error("Ошибка броска:", err);
                    status.innerText = "Ошибка: " + response.status;
                    status.style.color = "#ff4444";
                }
            } catch (e) { 
                status.innerText = "Ошибка сети"; 
            }
            setTimeout(() => { status.style.color = ""; status.innerText = "Готов"; }, 2000);
        }

        async function autoSave() {
            const data = { name: document.getElementById('charName').value };
            SCHEMA.forEach(s => {
                const input = document.getElementById(s.id);
                if (input) data[s.id] = input.value;
            });
            await OBR.player.setMetadata({ "ru_dnd_sheet/v2": data });
        }

        OBR.onReady(async () => {
            buildUI();
            const metadata = await OBR.player.getMetadata();
            const data = metadata["ru_dnd_sheet/v2"];
            if (data) {
                document.getElementById('charName').value = data.name || "";
                SCHEMA.forEach(s => { 
                    const input = document.getElementById(s.id);
                    if (input && data[s.id]) input.value = data[s.id]; 
                });
            }
            updateAll();
            await fetchAvailableThemes();
            document.getElementById('charName').oninput = autoSave;
            document.getElementById('status').innerText = "Готов";
        });
    </script>
</body>
</html>
